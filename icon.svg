<!-- Source for icon.png, the 256x256 Thunderstore icon. After editing, re-render it at 256x256
     (for example: open it in a browser at that size and screenshot it, or export from Inkscape). -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="room" cx="0.68" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#3f5a6e"/>
      <stop offset="0.55" stop-color="#2a2d4a"/>
      <stop offset="1" stop-color="#1b1a2e"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dffa8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7dffa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4a35"/>
      <stop offset="1" stop-color="#10291e"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Room, lit by the monitor -->
  <rect width="256" height="256" fill="url(#room)"/>
  <circle cx="175" cy="118" r="110" fill="url(#glow)"/>

  <!-- Desk -->
  <rect x="-4" y="188" width="264" height="72" fill="#8a5a33" stroke="#24180f" stroke-width="4"/>
  <rect x="-4" y="188" width="264" height="10" fill="#a8703f" stroke="#24180f" stroke-width="4"/>

  <!-- CRT monitor: deep beige box, screen towards us -->
  <path d="M150 60 L232 60 L244 72 L244 166 L150 166 Z" fill="#b9ae8c" stroke="#24180f" stroke-width="4" stroke-linejoin="round"/>
  <rect x="128" y="66" width="106" height="104" rx="12" fill="#e2d8b8" stroke="#24180f" stroke-width="4"/>
  <rect x="140" y="77" width="82" height="72" rx="10" fill="url(#screen)" stroke="#24180f" stroke-width="4"/>
  <!-- Pixel sword on the screen -->
  <g fill="#7dffa8" filter="url(#soft)">
    <rect x="179" y="86" width="5" height="5"/>
    <rect x="178" y="90" width="7" height="34"/>
    <rect x="168" y="123" width="27" height="5"/>
    <rect x="179" y="128" width="5" height="10"/>
    <rect x="177" y="137" width="9" height="5"/>
  </g>
  <!-- Scanlines and glare -->
  <g stroke="#000" stroke-opacity="0.18" stroke-width="1">
    <line x1="142" y1="88" x2="220" y2="88"/><line x1="142" y1="98" x2="220" y2="98"/>
    <line x1="142" y1="108" x2="220" y2="108"/><line x1="142" y1="118" x2="220" y2="118"/>
    <line x1="142" y1="128" x2="220" y2="128"/><line x1="142" y1="138" x2="220" y2="138"/>
  </g>
  <path d="M148 86 Q150 81 158 81 L170 81" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
  <!-- Power light and vents -->
  <circle cx="220" cy="160" r="3" fill="#ffb02e" stroke="#24180f" stroke-width="1.5"/>
  <line x1="146" y1="160" x2="166" y2="160" stroke="#9c9274" stroke-width="3" stroke-linecap="round"/>
  <!-- Stand -->
  <path d="M164 170 L198 170 L206 190 L156 190 Z" fill="#cfc4a2" stroke="#24180f" stroke-width="4" stroke-linejoin="round"/>

  <!-- Coffee mug -->
  <path d="M220 172 L244 172 L242 194 L222 194 Z" fill="#c8453b" stroke="#24180f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M243 177 C254 177 254 189 242 189" fill="none" stroke="#24180f" stroke-width="4"/>
  <path d="M228 166 C224 160 232 158 228 152" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Keyboard -->
  <path d="M112 196 L210 196 L216 210 L106 210 Z" fill="#e2d8b8" stroke="#24180f" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#9c9274" stroke-width="2.5" stroke-linecap="round">
    <line x1="118" y1="202" x2="204" y2="202"/>
    <line x1="116" y1="206" x2="206" y2="206"/>
  </g>

  <!-- The old man: hunched cardigan back -->
  <path d="M-6 260 L-6 196 C-4 138 20 98 58 96 C90 94 112 118 120 146 L124 170 C126 190 112 210 96 260 Z"
        fill="#6b7a3e" stroke="#24180f" stroke-width="4" stroke-linejoin="round"/>
  <!-- Cardigan stripe along the hump -->
  <path d="M10 176 C20 136 40 108 68 104" fill="none" stroke="#56632f" stroke-width="6" stroke-linecap="round"/>
  <!-- Arm reaching to the keyboard -->
  <path d="M98 150 C112 172 124 186 138 196" fill="none" stroke="#24180f" stroke-width="24" stroke-linecap="round"/>
  <path d="M98 150 C112 172 124 186 138 196" fill="none" stroke="#6b7a3e" stroke-width="16" stroke-linecap="round"/>
  <circle cx="144" cy="198" r="9" fill="#f0bf98" stroke="#24180f" stroke-width="4"/>

  <!-- Head, pushed forward and down towards the screen -->
  <g transform="translate(4 14)">
  <circle cx="110" cy="112" r="27" fill="#f0bf98" stroke="#24180f" stroke-width="4"/>
  <!-- White hair around the back of the bald head -->
  <path d="M86 98 C76 100 74 112 80 118 C74 124 80 134 88 132 C90 138 98 138 100 132"
        fill="#f4f1ea" stroke="#24180f" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Ear -->
  <ellipse cx="98" cy="118" rx="6" ry="8" fill="#e6a985" stroke="#24180f" stroke-width="3"/>
  <!-- Bald shine -->
  <path d="M100 94 Q108 89 117 91" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  <!-- Beard and moustache -->
  <path d="M112 124 C118 128 132 128 140 124 C142 132 138 142 128 148 C120 152 110 148 106 140 C104 134 106 128 112 124 Z"
        fill="#f4f1ea" stroke="#24180f" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Big nose -->
  <circle cx="139" cy="117" r="8" fill="#eaa67f" stroke="#24180f" stroke-width="3.5"/>
  <!-- Round glasses lit green by the screen -->
  <circle cx="126" cy="106" r="9" fill="#bff5d2" fill-opacity="0.55" stroke="#24180f" stroke-width="3.5"/>
  <line x1="117" y1="105" x2="104" y2="108" stroke="#24180f" stroke-width="3"/>
  <path d="M122 102 L127 100" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Bushy eyebrow -->
  <path d="M115 95 C119 89 129 88 136 93" fill="none" stroke="#f4f1ea" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
